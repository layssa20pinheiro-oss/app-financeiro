<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle Financeiro Completo</title>
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Chart.js para Gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-primary: #f4f6f9;
      --bg-card: #ffffff;
      --text-color: #2d3748;
      --border-color: #e2e8f0;
      --accent-color: #3182ce;
      --success-color: #38a169;
      --danger-color: #e53e3e;
      --warning-color: #dd6b20;
    }

    [data-theme="dark"] {
      --bg-primary: #1a202c;
      --bg-card: #2d3748;
      --text-color: #edf2f7;
      --border-color: #4a5568;
      --accent-color: #63b3ed;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; transition: background-color 0.3s, color 0.3s; }
    body { background-color: var(--bg-primary); color: var(--text-color); padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .theme-btn { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-color); cursor: pointer; }

    /* Cards de Resumo */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .card { background: var(--bg-card); padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); text-align: center; }
    .card p { font-size: 13px; opacity: 0.8; }
    .card h2 { font-size: 20px; margin-top: 5px; }

    /* Navegação por Abas */
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--border-color); }
    .tab-btn { padding: 10px 20px; background: none; border: none; color: var(--text-color); font-weight: bold; cursor: pointer; opacity: 0.6; }
    .tab-btn.active { opacity: 1; border-bottom: 3px solid var(--accent-color); }

    .tab-content { display: none; background: var(--bg-card); padding: 20px; border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 20px; }
    .tab-content.active { display: block; }

    /* Formulários e Inputs */
    form { display: grid; gap: 12px; margin-bottom: 15px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    input, select, button { padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-color); font-size: 14px; }
    button.btn-primary { background-color: var(--accent-color); color: white; border: none; font-weight: bold; cursor: pointer; }

    /* Listas */
    ul { list-style: none; }
    li { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid var(--border-color); }
    .val-receita { color: var(--success-color); font-weight: bold; }
    .val-despesa { color: var(--danger-color); font-weight: bold; }

    /* Layout do Dashboard */
    .charts-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 15px; }
    .chart-box { max-width: 100%; height: 260px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Gestão Financeira</h1>
      <button class="theme-btn" id="toggle-theme">🌙 Modo Escuro</button>
    </header>

    <!-- Cards de Visão Geral -->
    <div class="cards-grid">
      <div class="card"><p>Conta Corrente</p><h2 id="saldo-corrente">R$ 0,00</h2></div>
      <div class="card"><p>Poupança/Investimentos</p><h2 id="saldo-investimento">R$ 0,00</h2></div>
      <div class="card"><p>Faturas de Cartão</p><h2 id="saldo-cartao" style="color: var(--danger-color)">R$ 0,00</h2></div>
    </div>

    <!-- Abas de Navegação -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('dashboard')">Dashboard</button>
      <button class="tab-btn" onclick="switchTab('lancamentos')">Lançamentos</button>
      <button class="tab-btn" onclick="switchTab('contas')">Contas e Cartões</button>
    </div>

    <!-- ABA 1: DASHBOARD -->
    <div id="tab-dashboard" class="tab-content active">
      <h3>Resumo por Categoria</h3>
      <div class="charts-container">
        <div class="chart-box"><canvas id="chartCategorias"></canvas></div>
      </div>
    </div>

    <!-- ABA 2: LANÇAMENTOS -->
    <div id="tab-lancamentos" class="tab-content">
      <h3>Novo Lançamento</h3>
      <form id="form-lancamento">
        <input type="text" id="desc" placeholder="Descrição (ex: Supermercado)" required />
        <input type="number" id="valor" step="0.01" placeholder="Valor (R$)" required />
        <select id="tipo">
          <option value="despesa">Despesa</option>
          <option value="receita">Receita</option>
        </select>
        <select id="origem">
          <option value="corrente">Conta Corrente</option>
          <option value="investimento">Poupança / Investimento</option>
          <option value="cartao">Cartão de Crédito</option>
        </select>
        <select id="categoria">
          <option value="Alimentação">Alimentação</option>
          <option value="Moradia">Moradia</option>
          <option value="Lazer">Lazer</option>
          <option value="Investimento">Investimentos</option>
          <option value="Outros">Outros</option>
        </select>
        <button type="submit" class="btn-primary">Registrar Lançamento</button>
      </form>

      <h3>Histórico</h3>
      <ul id="lista-historico"></ul>
    </div>

    <!-- ABA 3: CONTAS E CARTÕES -->
    <div id="tab-contas" class="tab-content">
      <h3>Cadastrar Conta / Investimento</h3>
      <form id="form-conta">
        <input type="text" id="nome-conta" placeholder="Nome (ex: Nubank, Banco do Brasil)" required />
        <select id="tipo-conta">
          <option value="corrente">Conta Corrente</option>
          <option value="poupanca">Poupança</option>
          <option value="investimento">Investimento</option>
        </select>
        <button type="submit" class="btn-primary">Salvar Conta</button>
      </form>

      <h3 style="margin-top:20px;">Cadastrar Cartão de Crédito</h3>
      <form id="form-cartao">
        <input type="text" id="nome-cartao" placeholder="Nome do Cartão (ex: Cartão XP)" required />
        <input type="number" id="limite-cartao" placeholder="Limite de Crédito (R$)" required />
        <button type="submit" class="btn-primary">Salvar Cartão</button>
      </form>
    </div>
  </div>

  <script>
    // Inicialização do Supabase
    const supabaseUrl = 'https://cbhdlewbvegrsdbrdszw.supabase.co';
    const supabaseAnonKey = 'sb_publishable_1cRh5f00jopLbhnapQNaSw_RZMxO';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

    let chartInstance = null;

    // Alternar Modo Escuro
    document.getElementById('toggle-theme').addEventListener('click', () => {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('toggle-theme').innerText = isDark ? '🌙 Modo Escuro' : '☀️ Modo Claro';
    });

    // Alternar Abas
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(`tab-${tabName}`).classList.add('active');
      if (tabName === 'dashboard') carregarDashboard();
    }

    // Carregar Lançamentos e Calcular Saldos
    async function carregarDados() {
      const { data: transacoes, error } = await supabaseClient
        .from('transacoes')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) return console.error(error);

      let corrente = 0, investimentos = 0, cartao = 0;
      const lista = document.getElementById('lista-historico');
      lista.innerHTML = '';

      transacoes.forEach(t => {
        const val = parseFloat(t.valor);
        if (t.tipo === 'receita') {
          if (t.seletor_tipo === 'conta') corrente += val;
        } else {
          if (t.seletor_tipo === 'cartao') cartao += val;
          else corrente -= val;
        }

        const li = document.createElement('li');
        li.innerHTML = `
          <span>${t.descricao} <small>(${t.categoria_id || 'Geral'})</small></span>
          <span class="val-${t.tipo}">${t.tipo === 'receita' ? '+' : '-'} R$ ${val.toFixed(2)}</span>
        `;
        lista.appendChild(li);
      });

      document.getElementById('saldo-corrente').innerText = `R$ ${corrente.toFixed(2)}`;
      document.getElementById('saldo-cartao').innerText = `R$ ${cartao.toFixed(2)}`;
      carregarDashboard(transacoes);
    }

    // Gerar Gráfico no Dashboard
    function carregarDashboard(transacoes = []) {
      const categorias = {};
      
      transacoes.filter(t => t.tipo === 'despesa').forEach(t => {
        const cat = t.categoria_id || 'Outros';
        categorias[cat] = (categorias[cat] || 0) + parseFloat(t.valor);
      });

      const ctx = document.getElementById('chartCategorias').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: Object.keys(categorias),
          datasets: [{
            data: Object.values(categorias),
            backgroundColor: ['#e53e3e', '#dd6b20', '#3182ce', '#38a169', '#805ad5']
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    // Form de Lançamentos
    document.getElementById('form-lancamento').addEventListener('submit', async (e) => {
      e.preventDefault();
      const descricao = document.getElementById('desc').value;
      const valor = parseFloat(document.getElementById('valor').value);
      const tipo = document.getElementById('tipo').value;
      const origem = document.getElementById('origem').value;
      const categoria_id = document.getElementById('categoria').value;

      const { error } = await supabaseClient.from('transacoes').insert([{
        descricao, valor, tipo, 
        seletor_tipo: origem === 'cartao' ? 'cartao' : 'conta',
        categoria_id
      }]);

      if (!error) {
        document.getElementById('form-lancamento').reset();
        carregarDados();
      }
    });

    carregarDados();
  </script>
</body>
</html>
